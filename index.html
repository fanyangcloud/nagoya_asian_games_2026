    // 细粒度专业体育词法字典 (覆盖泳姿、空手道、拳法、阶次元)

      "Taijijian": { zh: "太极剑", ko: "태극검", vi: "Thái cực kiếm", th: "กระบี่ไทเก๊ก" },

      // 阶段与组别
      "Finals": { zh: "决赛", ko: "결승전", vi: "Chung kết", th: "รอบชิงชนะเลิศ" },
      "Final": { zh: "决赛", ko: "결승", vi: "Chung kết", th: "รอบชิงชนะเลิศ" },
      "Semi-final": { zh: "半决赛", ko: "준결승", vi: "Bán kết", th: "รอบรองชนะเลิศ" },
      "Semifinals": { zh: "半决赛", ko: "준결승", vi: "Bán kết", th: "รอบรองชนะเลิศ" },
      "Quarter-final": { zh: "1/4决赛", ko: "8강전", vi: "Tứ kết", th: "รอบก่อนรองชนะเลิศ" },

      "Mixed": { zh: "混合", ko: "혼합", vi: "Hỗn hợp", th: "ผสม" }

    let disciplinesData = [];
    let currentLang = 'zh';
    let currentDate = '2026-09-21';
    let rawDailyMatches = [];
    let isMedalOnly = false;
    let selectedDisc = 'ALL';

    // 细粒度深层词汇翻译
    function smartTranslate(text) {
      if (!text) return '';
      if (currentLang === 'en') return text;

      let result = text;

      // 1. 词典深度替换 (优先长短语，后短词)
      const sortedKeys = Object.keys(termVocabulary).sort((a, b) => b.length - a.length);
      for (const key of sortedKeys) {
        if (termVocabulary[key][currentLang] && result.includes(key)) {
          result = result.replaceAll(key, termVocabulary[key][currentLang]);
        }
      }

      // 2. 模式与度量衡单位正则替换
      if (currentLang === 'zh') {
        result = result.replace(/(\d+)\s*m\b/g, "$1米")
                       .replace(/-(\d+)\s*kg\b/g, "-$1公斤级")
                       .replace(/\+(\d+)\s*kg\b/g, "+$1公斤级")
                       .replace(/(\d+)\s*kg\b/g, "$1公斤级")
                       .replace(/Group ([A-Z])/g, "$1组")
                       .replace(/Pool ([A-Z])/g, "$1组")
                       .replace(/Match (\d+)/g, "第$1场")
                       .replace(/Court (\d+)/g, "$1号场地");
      } else if (currentLang === 'ko') {
        result = result.replace(/-(\d+)\s*kg\b/g, "-$1kg급")
                       .replace(/\+(\d+)\s*kg\b/g, "+$1kg급")
                       .replace(/(\d+)\s*kg\b/g, "$1kg급")
                       .replace(/Group ([A-Z])/g, "$1조")
                       .replace(/Pool ([A-Z])/g, "$1조")
                       .replace(/Match (\d+)/g, "$1경기")
                       .replace(/Court (\d+)/g, "$1코트");
      } else if (currentLang === 'vi') {
        result = result.replace(/Group ([A-Z])/g, "Bảng $1")
                       .replace(/Pool ([A-Z])/g, "Bảng $1")
                       .replace(/Match (\d+)/g, "Trận $1");
      } else if (currentLang === 'th') {
        result = result.replace(/(\d+)\s*m\b/g, "$1 ม.")
                       .replace(/Group ([A-Z])/g, "กลุ่ม $1")
                       .replace(/Pool ([A-Z])/g, "กลุ่ม $1")
                       .replace(/Match (\d+)/g, "แมตช์ $1");
      }

      return result;
    }

    function getDiscInfo(discCode) {
      return disciplinesData.find(d => d.code === discCode);
    }

    function getDiscName(discCode, fallbackDesc) {
      const item = getDiscInfo(discCode);
      if (!item) return fallbackDesc || discCode;
      const key = `name_${currentLang}`;
      return item[key] || item.name_zh || item.name_en || fallbackDesc || discCode;
    }

    // 日本主办城市与场馆词库深度翻译
    function smartTranslateVenue(venueStr) {
      if (!venueStr) return '待定场馆';
      let v = venueStr;
      if (currentLang === 'zh') {
        return v.replace(/Tokyo Aquatics Centre/g, "东京水上运动中心")
                .replace(/Tokyo/g, "东京")
                .replace(/Nagoya/g, "名古屋")
                .replace(/Toyohashi/g, "丰桥")
                .replace(/Gamagori/g, "蒲郡")
                .replace(/Hekinan/g, "碧南")
                .replace(/Kasugai/g, "春日井")
                .replace(/Okazaki/g, "冈崎")
                .replace(/City/g, "市")
                .replace(/Prefectural/g, "县立")
                .replace(/Pref\./g, "县立")
                .replace(/General Shooting Gallery/g, "综合射击场")
                .replace(/Tennis Center/g, "网球中心")
                .replace(/Martial Arts Hall/g, "武道馆")
                .replace(/General Gymnasium/g, "综合体育馆")
                .replace(/Gymnasium/g, "体育馆")
                .replace(/Triathlon Venue/g, "铁人三项赛场")
                .replace(/Beach Court/g, "沙滩排球场")
                .replace(/Park/g, "公园");
      } else if (currentLang === 'ko') {
        return v.replace(/Tokyo/g, "도쿄")
                .replace(/Nagoya/g, "나고야")
                .replace(/Toyohashi/g, "도요하시")
                .replace(/Gamagori/g, "가마고리")
                .replace(/Tennis Center/g, "테니스 센터")
                .replace(/Martial Arts Hall/g, "무도관")
                .replace(/Gymnasium/g, "체육관")
                .replace(/Park/g, "공원");
      }
      return v;
    }

    function initDateStrip() {
      const strip = document.getElementById('date-strip');
      strip.innerHTML = '';
      const start = new Date('2026-09-10');
      const end = new Date('2026-10-04');

      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        const dStr = d.toISOString().split('T')[0];
        const monthDay = `${d.getMonth() + 1}/${d.getDate()}`;
        const isSelected = (dStr === currentDate);

        const btn = document.createElement('button');
        btn.className = `shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold transition-all ${
          isSelected 
            ? 'bg-blue-600 text-white shadow-sm shadow-blue-500/30' 
            : 'bg-white text-slate-600 hover:bg-slate-200/80 border border-slate-200'
        }`;
        btn.innerText = monthDay;
        btn.onclick = () => selectDate(dStr);
        strip.appendChild(btn);
      }
    }

    function selectDate(dStr) {
      currentDate = dStr;
      initDateStrip();
      loadSchedule(currentDate);
    }

    async function loadSchedule(dateStr) {
      const loading = document.getElementById('loading');
      const grid = document.getElementById('match-grid');
      const empty = document.getElementById('empty-state');
      
      loading.classList.remove('hidden');
      grid.innerHTML = '';
      empty.classList.add('hidden');

      try {
        const resp = await fetch(`./data/schedule_${dateStr}.json`);
        if (!resp.ok) throw new Error('Data file not found');
        rawDailyMatches = await resp.json();
        populateDiscOptions(rawDailyMatches);
        filterMatches();
      } catch (err) {
        console.warn('当日暂无数据或读取失败:', err);
        rawDailyMatches = [];
        populateDiscOptions([]);
        filterMatches();
      } finally {
        loading.classList.add('hidden');
      }
    }

    // 全量 59 项完整下拉菜单 + 智能分组 (今日开赛 vs 全部大项)
    function populateDiscOptions(matches) {
      const select = document.getElementById('disc-filter');
      const savedValue = select.value;
      const dict = i18n[currentLang];
      select.innerHTML = `<option value="ALL">${dict.allSports}</option>`;
      
      // 统计当天开赛的项目及场次
      const todayCountMap = new Map();
      matches.forEach(m => {
        todayCountMap.set(m.Disc, (todayCountMap.get(m.Disc) || 0) + 1);
      });

      // 1. 分组一：今日开赛的大项
      const todayGroup = document.createElement('optgroup');
      todayGroup.label = dict.optGroupToday;
      
      // 2. 分组二：全部 59 个大项
      const allGroup = document.createElement('optgroup');
      allGroup.label = dict.optGroupOther;

      // 遍历 disciplinesData 里的全量 59 项
      disciplinesData.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.code;
        const localizedName = getDiscName(item.code);
        const todayCnt = todayCountMap.get(item.code) || 0;

        const goldText = item.medal_event_count > 0 ? ` · ${item.medal_event_count}${dict.goldSuffix}` : '';
        
        if (todayCnt > 0) {
          const todayBadge = dict.todayMatchesSuffix.replace('{n}', todayCnt);
          opt.innerText = `🔥 ${localizedName} (${todayBadge}${goldText})`;
          todayGroup.appendChild(opt);
        } else {
          opt.innerText = `${localizedName}${goldText} (${item.match_count}${dict.matchesSuffix})`;
          allGroup.appendChild(opt);
        }
      });

      if (todayGroup.children.length > 0) {
        select.appendChild(todayGroup);
      }
      select.appendChild(allGroup);

      // 恢复之前选中的值
      if (savedValue && disciplinesData.some(d => d.code === savedValue)) {
        select.value = savedValue;
      }
    }

    function toggleMedalFilter() {
      isMedalOnly = !isMedalOnly;
      const btn = document.getElementById('medal-filter-btn');
      if (isMedalOnly) {
        btn.className = 'flex items-center space-x-1 px-3 py-1.5 rounded-full border border-amber-500 bg-amber-500 text-white font-bold transition-all shadow-sm';
      } else {
        btn.className = 'flex items-center space-x-1 px-3 py-1.5 rounded-full border border-slate-300 bg-white hover:bg-amber-50 text-slate-700 font-medium transition-all shadow-2xs';
      }
      filterMatches();
    }

    function filterMatches() {
      selectedDisc = document.getElementById('disc-filter').value;
      const filtered = rawDailyMatches.filter(m => {
        const matchDisc = (selectedDisc === 'ALL' || m.Disc === selectedDisc);
        const matchMedal = (!isMedalOnly || m.Medal === '1');
        return matchDisc && matchMedal;
      });

      renderMatches(filtered);
    }

    function renderMatches(list) {
      const grid = document.getElementById('match-grid');
      const empty = document.getElementById('empty-state');
      const counter = document.getElementById('txt-matches-count');
      
      counter.innerText = i18n[currentLang].matchesCount.replace('{n}', list.length);
      grid.innerHTML = '';

      if (list.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      const dict = i18n[currentLang];

      list.forEach(m => {
        const isMedal = (m.Medal === '1');
        const time = m.DateTimeRaw ? m.DateTimeRaw.substring(11, 16) : '--:--';
        const venue = smartTranslateVenue(m.VenueDescS || m.VenueDesc);

        const discName = getDiscName(m.Disc, m.DiscDesc);
        const eventTitle = smartTranslate(m.EventDesc);
        const phaseTitle = smartTranslate(m.PhaseDesc || m.UnitDesc || '');

        const card = document.createElement('div');
        card.className = `bg-white rounded-xl p-4 border transition-all hover:shadow-md flex flex-col justify-between ${
          isMedal ? 'border-amber-300 shadow-2xs bg-gradient-to-br from-white via-white to-amber-50/30' : 'border-slate-200'
        }`;

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-700">${discName}</span>
              <div class="flex items-center space-x-1.5">
                ${isMedal ? `<span class="bg-amber-100 text-amber-800 text-[11px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1">🥇 ${dict.goldBadge}</span>` : ''}
                <span class="text-[11px] text-slate-400 font-medium">${m.Status === 'OFFICIAL' ? dict.official : dict.scheduled}</span>
              </div>
            </div>

            <h4 class="text-sm font-bold text-slate-800 leading-snug line-clamp-2">${eventTitle}</h4>
            <p class="text-xs text-blue-600 font-medium mt-1">${phaseTitle}</p>

            ${m.isH2H ? `
              <div class="mt-3 py-2 px-2.5 bg-slate-50 rounded-lg text-xs flex justify-between items-center font-medium">
                <span class="truncate text-slate-700">${m.Home?.Name || dict.tbd}</span>
                <span class="text-slate-400 px-2 font-bold">${dict.vs}</span>
                <span class="truncate text-slate-700">${m.Away?.Name || dict.tbd}</span>
              </div>
            ` : ''}
          </div>

          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
            <span class="text-slate-400 flex items-center gap-1 truncate max-w-[190px]" title="${venue}">
              🕒 ${time} | ${venue}
            </span>
            <button onclick="viewResultDetail('${m.Disc}', '${m.Key}')" class="text-blue-600 hover:text-blue-700 font-semibold cursor-pointer shrink-0">
              ${dict.viewDetail} →
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function viewResultDetail(disc, key) {
      const modal = document.getElementById('result-modal');
      const body = document.getElementById('modal-body');
      const discTitle = document.getElementById('modal-disc');
      const eventTitle = document.getElementById('modal-event-title');
      const timeVenue = document.getElementById('modal-time-venue');

      discTitle.innerText = getDiscName(disc);
      eventTitle.innerText = key;
      timeVenue.innerText = "正在拉取权威赛果归档...";
      body.innerHTML = '<div class="text-center py-8 text-slate-400">正在加载成绩单...</div>';
      modal.classList.remove('hidden');

      try {
        const resp = await fetch(`./data/results/${key}.json`);
        if (!resp.ok) throw new Error('Result not cached');
        const data = await resp.json();

        eventTitle.innerText = smartTranslate(data.Info?.EventDesc) || key;
        timeVenue.innerText = `${smartTranslateVenue(data.Info?.VenueDesc)} · ${data.Info?.StatusDesc || ''}`;

        if (data.Competitors && data.Competitors.length > 0) {
          let html = '<div class="divide-y divide-slate-100">';
          data.Competitors.forEach(c => {
            const medalIcon = c.Medal === 'ME_GOLD' ? '🥇' : (c.Medal === 'ME_SILVER' ? '🥈' : (c.Medal === 'ME_BRONZE' ? '🥉' : ''));
            html += `
              <div class="py-2.5 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                  <span class="w-6 text-center font-bold ${c.Rk === '1' ? 'text-amber-500' : 'text-slate-400'}">${medalIcon || c.Rk}</span>
                  <div>
                    <p class="font-bold text-slate-800">${c.Name} <span class="text-xs text-slate-400 font-normal">(${c.Org})</span></p>
                    <p class="text-[11px] text-slate-400">反应时间: ${c.Extensions?.find(e => e.Code === 'Reaction')?.Value || '--'}s</p>
                  </div>
                </div>
                <div class="text-right">
                  <span class="font-mono font-bold text-slate-700">${c.Result}</span>
                  ${c.RecordInd ? `<span class="ml-1 text-[10px] bg-red-100 text-red-600 px-1 py-0.5 rounded font-bold">${c.RecordInd}</span>` : ''}
                </div>
              </div>
            `;
          });
          html += '</div>';
          body.innerHTML = html;
        } else {
          body.innerHTML = '<div class="text-center py-8 text-slate-400">该比赛暂无参赛选手成绩明细。</div>';
        }
      } catch (err) {
        body.innerHTML = `
          <div class="text-center py-8 text-slate-400">
            <p class="text-2xl mb-1">⏳</p>
            <p class="font-medium text-slate-600">本场赛果数据尚未归档</p>
            <p class="text-xs mt-1 text-slate-400">比赛进行中或等待组委会发布正式公报。</p>
          </div>
        `;
      }
    }

    function closeModal() {
      document.getElementById('result-modal').classList.add('hidden');
    }

    function changeLanguage(lang) {
      currentLang = lang;
      const dict = i18n[lang];
      document.getElementById('site-title').innerText = dict.title;
      document.getElementById('site-subtitle').innerText = dict.subtitle;
      document.getElementById('txt-medal-filter').innerText = dict.medalOnly;
      document.getElementById('banner-tag').innerText = dict.bannerTag;
      document.getElementById('banner-text').innerText = dict.bannerText;
      document.getElementById('txt-loading').innerText = dict.loading;
      document.getElementById('txt-empty').innerText = dict.empty;

      populateDiscOptions(rawDailyMatches);
      filterMatches();
    }

    async function init() {
      try {
        const res = await fetch('./data/disciplines_i18n.json');
        if (res.ok) {
          disciplinesData = await res.json();
        }
      } catch (e) {
        console.warn('加载大项字典失败，降级显示英文');
      }

      initDateStrip();
      loadSchedule(currentDate);
    }

    init();
  </script>
</body>
</html>
